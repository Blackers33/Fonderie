plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.fonderie.resttimer'
version = '0.7.10'

android {
  namespace "com.fonderie.resttimer"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
  }
  lintOptions {
    abortOnError false
  }
}
dependencies {
  // NotificationCompat.setRequestPromotedOngoing (Live Updates) : à partir de 1.17.0
  implementation "androidx.core:core:1.17.0"
}
